name: CI Checks

on:
  pull_request:
    branches: [ "main", "master" ]
    paths: [ 'android/**', '.github/**' ]
  push:
    branches: [ "main", "master" ]
    paths: [ 'android/**', '.github/**' ]
    tags: [ '0302-pz02-*' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android

      # Любой упавший тест или недобор покрытия делает задание красным
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug koverVerifyDebug --stacktrace

      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'android/app/build/test-results/testDebugUnitTest/*.xml'
          check_name: Результаты unit-тестов

      - name: Coverage summary
        if: always()
        working-directory: .
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android/app/build/reports/kover/*.xml')
          if not files:
              print('Отчёт покрытия не найден'); raise SystemExit
          root = ET.parse(files[0]).getroot()
          print('### Покрытие кода (Kover)')
          for c in root.findall('counter'):
              m, v = int(c.get('missed')), int(c.get('covered'))
              total = m + v
              pct = 100 * v / total if total else 0
              print(f"- {c.get('type')}: {pct:.1f}% ({v}/{total})")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/kover/

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.*

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Build Android project
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release for tag
    if: github.ref_type == 'tag'
    needs: [unit-tests, lint, build, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
