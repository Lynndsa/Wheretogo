name: CI Checks

# Запускаем проверки при создании или обновлении Pull Request в основную ветку
on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java & JDK 17 (для Android / Kotlin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Выдаем права на выполнение скрипта Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Проверяем компиляцию и собираем проект
      - name: Build project
        run: ./gradlew assembleDebug

      # 5. Запускаем Unit-тесты
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
