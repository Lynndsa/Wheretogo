name: CI Checks

on:
  pull_request:
    branches: [ "main", "master" ]
    paths: [ 'android/**', '.github/**' ]
  push:
    branches: [ "main", "master" ]
    paths: [ 'android/**', '.github/**' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReport koverHtmlReport koverVerify --stacktrace

      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'android/app/build/test-results/testDebugUnitTest/*.xml'
          check_name: Результаты unit-тестов
          require_tests: true

      - name: Coverage summary
        if: always()
        working-directory: .
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android/app/build/reports/kover/*.xml')
          if not files:
              print('Отчёт покрытия не найден'); raise SystemExit
          root = ET.parse(files[0]).getroot()
          print('### Покрытие кода (Kover)')
